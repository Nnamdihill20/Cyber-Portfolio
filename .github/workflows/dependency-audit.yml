name: Dependency audit (sentinel-map)

on:
  pull_request:
    paths:
      - "sentinel-map/packages/api/package*.json"
      - "sentinel-map/packages/web/package*.json"
  schedule:
    # Weekly, independent of any PR - catches newly-disclosed advisories
    # against dependencies nobody touched. See sentinel-map/docs/SECURITY.md.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [api, web]
    defaults:
      run:
        working-directory: sentinel-map/packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
